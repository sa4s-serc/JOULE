name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile checks
        run: |
          python -m py_compile \
            src/infrastructure/codegen/python_codegen.py \
            src/application/agents/base.py \
            src/application/agents/registry.py \
            src/application/agents/protocol.py \
            src/application/agents/runtime.py \
            src/application/agents/policies.py \
            src/application/engine/evolution.py \
            api/models.py \
            api/manager.py \
            cli/commands/optimize.py

      - name: Run agentic test suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_agentic_mode.py tests/test_agents_runtime.py
